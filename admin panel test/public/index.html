<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureCore // Enterprise Admin Gateway</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
            --danger-color: #f85149;
            --success-color: #2ea043;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h2 {
            margin-top: 0;
            color: #fff;
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #8b949e;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: var(--success-color);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #238636;
        }

        .error-msg {
            color: var(--danger-color);
            font-size: 0.85rem;
            margin-top: 15px;
            text-align: center;
            min-height: 20px;
        }

        .dashboard {
            display: none;
            text-align: center;
        }

        .secret-flag {
            background: #21262d;
            border: 1px dashed var(--accent-color);
            padding: 15px;
            margin-top: 20px;
            font-family: monospace;
            word-break: break-all;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="login-container" id="authBox">
        <h2>System Authentifizierung</h2>
        
        <div id="loginForm">
            <div class="input-group">
                <label for="username">Benutzername</label>
                <input type="text" id="username" autocomplete="off" value="root_admin">
            </div>
            
            <div class="input-group">
                <label for="password">Passwort / API-Key</label>
                <input type="password" id="password" autocomplete="new-password">
            </div>

            <button id="loginBtn" onclick="attemptLogin()">Anmelden</button>
            <div class="error-msg" id="errorMsg"></div>
        </div>

        <div class="dashboard" id="dashboard">
            <h2 style="color: var(--success-color);">Zugriff Gewährt!</h2>
            <p>Willkommen im Admin-Bereich, Operator.</p>
            <div class="secret-flag">FLAG{h4ck_th3_pl4n3t_99812}</div>
        </div>
    </div>

    <script>
        // URL-Parameter-Check
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('access') !== 'granted') {
                document.body.innerHTML = "<h1 style='color: white; text-align: center; margin-top: 20vh;'>404 Not Found</h1>";
            }
        };

        function attemptLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');

            // Fester Test-Check
            if (user === "root_admin" && pass === "admin123") {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                errorDiv.innerText = "Ungültige Anmeldedaten!";
            }
        }
    </script>
</body>
</html>
