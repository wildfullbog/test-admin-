<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Admin Panel // Secure Core</title>
    <style>
        :root { 
            --bg: #030305; 
            --panel: rgba(10, 10, 15, 0.8); 
            --border: rgba(255, 255, 255, 0.08); 
            --border-hover: rgba(59, 130, 246, 0.5);
            --border-focus: #3b82f6; 
            --accent: #3b82f6; 
            --accent-glow: rgba(59, 130, 246, 0.4);
            --text: #ffffff; 
            --text-dim: #71717a;
            --err: #ef4444; 
            --succ: #22c55e; 
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(59, 130, 246, 0.25), transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(147, 51, 234, 0.12), transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(59, 130, 246, 0.12), transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }

        .box { 
            background: var(--panel); 
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border); 
            padding: 50px 45px; 
            border-radius: 20px; 
            width: 400px; 
            box-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.03) inset; 
            animation: boxEnter 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        @keyframes boxEnter {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .box::before {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            box-shadow: 0 0 15px var(--accent);
        }

        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }

        .dot:nth-child(1) { background: #ef4444; }
        .dot:nth-child(2) { background: #f59e0b; }
        .dot:nth-child(3) { background: #22c55e; }

        h2 { 
            margin: 0; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            text-align: right; 
            color: var(--text-dim);
            font-weight: 600;
        }

        h2 span {
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .group { 
            margin-bottom: 24px; 
            position: relative;
        }

        label { 
            display: block; 
            font-size: 0.7rem; 
            color: var(--text-dim); 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: 600;
            transition: color 0.3s;
        }

        .group:focus-within label {
            color: var(--accent);
        }

        input { 
            width: 100%; 
            padding: 15px 18px; 
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid var(--border); 
            color: var(--text); 
            box-sizing: border-box; 
            font-family: inherit;
            font-size: 0.95rem;
            border-radius: 12px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:hover {
            border-color: var(--border-hover);
        }

        input:focus { 
            outline: none; 
            border-color: var(--border-focus); 
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 0 4px var(--accent-glow), 0 0 25px rgba(59, 130, 246, 0.2); 
        }

        button { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); 
            border: none; 
            color: white; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-family: inherit;
            font-size: 0.85rem;
            border-radius: 12px; 
            letter-spacing: 2.5px; 
            margin-top: 10px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 25px var(--accent-glow);
            position: relative;
            overflow: hidden;
        }

        button::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: 0.6s;
        }

        button:hover::after {
            left: 100%;
        }

        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(59, 130, 246, 0.6); 
        }

        button:active {
            transform: translateY(1px);
        }

        .err { 
            color: var(--err); 
            font-size: 0.75rem; 
            margin-top: 15px; 
            text-align: center; 
            height: 15px; 
            font-weight: 500;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        .trap { display: none; }
        
        .dash { 
            display: none; 
            text-align: center; 
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .flag { 
            background: rgba(0, 0, 0, 0.6); 
            border: 1px dashed rgba(59, 130, 246, 0.5); 
            padding: 20px; 
            margin-top: 25px; 
            word-break: break-all; 
            color: var(--accent); 
            font-size: 0.9rem; 
            border-radius: 12px; 
            font-family: monospace;
            box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.15);
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="terminal-header">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <h2>Hacker <span>Admin Panel</span></h2>
        </div>
        <div id="f">
            <div class="group">
                <label>User</label>
                <input type="text" id="u" autocomplete="off" placeholder="">
            </div>
            <div class="group">
                <label>Password</label>
                <input type="password" id="p" placeholder="">
            </div>
            <div class="trap">
                <label>URL</label>
                <input type="text" id="t" value="">
            </div>
            <button id="b" onclick="x0()">Authentifizieren</button>
            <div class="err" id="e"></div>
        </div>
        <div class="dash" id="d">
            <h2 style="color: var(--succ); margin-bottom: 12px; text-shadow: 0 0 20px rgba(34,197,94,0.4); font-size: 1.1rem; text-align: center;">Access Granted</h2>
            <p style="font-size: 0.85rem; color: var(--text-dim); margin-top: 0; letter-spacing: 0.5px;">Root-Sitzung erfolgreich initialisiert.</p>
            <div class="flag" id="fl"></div>
        </div>
    </div>
    <script>
        // Sichere Hashes (SHA-256) – hier ist kein Passwort mehr im Klartext oder lesbar hinterlegt!
        const targetUserHash = "a665a4fa336338e9c09c91f1a4e178120d575c596ff1b3152674e1d15c7a4005"; // Entspricht: root_admin
        const targetPassHash = "780998cc26eeb6f1e16f39387a2d48c82309e3e3b392a8398e20e3656e18f2d8"; // Entspricht dem echten Passwort

        async function hashString(string) {
            const encoder = new TextEncoder();
            const data = encoder.encode(string);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if (params.get("access") !== "granted") {
                document.body.innerHTML = "<h1 style='text-align:center;margin-top:20vh;font-family:sans-serif;color:#fff;'>404 Not Found</h1>";
            }
        };

        async function x0() {
            if (document.getElementById('t').value !== "") {
                document.getElementById('e').innerText = "Protocol Violation";
                return;
            }
            
            const userInput = document.getElementById('u').value.trim();
            const passInput = document.getElementById('p').value;
            const errElem = document.getElementById('e');
            
            // Hashes im Hintergrund berechnen und vergleichen
            const uHash = await hashString(userInput);
            const pHash = await hashString(passInput);
            
            if (uHash === targetUserHash && pHash === targetPassHash) {
                document.getElementById('f').style.display = 'none';
                document.getElementById('fl').innerText = "FLAG{c0de_obfusc4ti0n_m4st3r_9981}";
                document.getElementById('d').style.display = 'block';
            } else {
                errElem.innerText = "";
                void errElem.offsetWidth; 
                errElem.innerText = "Zugriff verweigert.";
            }
        }
    </script>
</body>
</html>
